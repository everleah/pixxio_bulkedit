[tool.ruff]
target-version = "py314"
line-length = 100
include = ["*.py", "*.pyi", "*.ipynb"]
extend-exclude = ["vendor", "build", "dist"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]

[tool.pyright]
pythonVersion = "3.14"
typeCheckingMode = "basic"
venvPath = "."
venv = ".venv"
exclude = [".venv", "build", "dist", "vendor", "**/__pycache__"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
